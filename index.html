<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orchidarium · Inteligencia híbrida de orquídeas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="oa-header">
    <div class="oa-shell oa-nav">
      <button class="oa-brand" id="homeButton" type="button"><span>❋</span>Orchidarium</button>
      <nav>
        <span class="oa-connection" id="connectionStatus">Modo demo</span>
        <button data-view="search" type="button">Buscar</button>
        <button data-view="identify" type="button">Identificar</button>
        <button data-view="admin" type="button">Curation</button>
      </nav>
    </div>
  </header>

  <main id="app" class="oa-shell"></main>

  <footer class="oa-footer">
    <div class="oa-shell">
      <strong>Uso responsable:</strong> no se scrapean ni republican fuentes restringidas. Toda imagen debe conservar URL, licencia, fotógrafo, titular de derechos y fecha de acceso.
    </div>
  </footer>

  <template id="homeTemplate">
    <section class="oa-hero">
      <div>
        <p class="oa-eyebrow">Orchidaceae · especies · grexes · cultivares/clones</p>
        <h1>Identificación híbrida, <em>probabilística</em> y curada.</h1>
        <p class="oa-lede">Orchidarium prioriza los híbridos registrados sin mezclar taxonomía botánica con horticultura: especies WCVP/POWO+GBIF, grexes RHS-ready, clones premiados, parentaje recursivo, OCR de etiquetas e identificación visual con pgvector.</p>
        <form class="oa-search" data-search-form>
          <input name="q" placeholder="Busca Cattleya dowiana, Rlc. Hawaiian Passion, Blc. Mem. Helen Brown…" autocomplete="off">
          <button type="submit">Buscar</button>
        </form>
        <div class="oa-chips" data-chip-row></div>
      </div>
      <aside class="oa-panel oa-live-card">
        <p class="oa-eyebrow">Resultado demo</p>
        <h2>Rhyncholaeliocattleya Hawaiian Passion</h2>
        <p>72% · hipótesis combinada por etiqueta, similitud visual y parentaje.</p>
        <div class="oa-meter"><span style="width:72%"></span></div>
        <ul>
          <li>Plant.id: 0.68</li>
          <li>pgvector interno: 0.74</li>
          <li>Boost por parentaje: +0.04</li>
        </ul>
      </aside>
    </section>
    <section>
      <div class="oa-section-head">
        <h2>Módulos operativos</h2>
        <p>Una primera interfaz navegable para validar búsquedas, perfiles, árbol de parentaje, identificación por imagen y cola de curaduría.</p>
      </div>
      <div class="oa-module-grid">
        <article><span>01</span><h3>Backbone taxonómico</h3><p>Especies aceptadas, sinónimos, autores, distribución, POWO/WCVP y GBIF.</p></article>
        <article><span>02</span><h3>Grexes registrados</h3><p>Padre semilla, padre polen, registrante, originador, fecha, fuente y verificación.</p></article>
        <article><span>03</span><h3>Clones y premios</h3><p>Cultivares ligados al grex, premios AOS/RHS, evidencias y estado curatorial.</p></article>
        <article><span>04</span><h3>Imagen + derechos</h3><p>Licencia, URL, fotógrafo, titular, fecha, hash perceptual, embedding y revisión.</p></article>
        <article><span>05</span><h3>OCR de etiquetas</h3><p>Normaliza abreviaturas y cruza especies, sinónimos, grexes y cultivares.</p></article>
        <article><span>06</span><h3>Curaduría experta</h3><p>Aprobar etiquetas, fusionar grexes, validar parentaje y marcar licencias dudosas.</p></article>
      </div>
    </section>
  </template>
</body>
<script src="config.js"></script>
<script src="app.js"></script>
</html>
