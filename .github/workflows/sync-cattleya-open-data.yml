name: Sync Cattleya open data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - 'scripts/sync_cattleya_open_data.py'
      - 'scripts/validate_cattleya_open_data.py'
      - 'tests/test_cattleya_inaturalist.py'
      - '.github/workflows/sync-cattleya-open-data.yml'

permissions:
  contents: write

concurrency:
  group: sync-cattleya-open-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the newest main, not a potentially stale push-event SHA.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests urllib3

      - name: Test photo-level licensing and taxon matching
        run: python -m unittest discover -s tests -p 'test_cattleya_inaturalist.py' -v

      - name: Build catalogue and licensed media index
        run: python scripts/sync_cattleya_open_data.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/cattleya_open_catalog.json >/dev/null
          python -m json.tool data/cattleya_open_media.json >/dev/null

      - name: Validate taxonomy, media consistency and licenses
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_cattleya_open_data.py | tee /tmp/cattleya-validation.txt
          {
            echo '### Cattleya open-data validation'
            echo '```text'
            cat /tmp/cattleya-validation.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guard against unexpected data loss
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for path in ("data/cattleya_open_catalog.json", "data/cattleya_open_media.json"):
              previous = subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True, text=True, check=False,
              )
              if previous.returncode != 0:
                  print(f"{path}: no prior version; baseline guard skipped.")
                  continue
              old_count = len(json.loads(previous.stdout)["records"])
              new_count = len(json.loads(Path(path).read_text(encoding="utf-8"))["records"])
              if old_count and new_count < old_count * 0.8:
                  raise SystemExit(
                      f"{path}: unexpected record loss ({old_count} -> {new_count}); "
                      "manual review required before publishing."
                  )
              if path.endswith("cattleya_open_catalog.json"):
                  old_rows = json.loads(previous.stdout)["records"]
                  new_rows = json.loads(Path(path).read_text(encoding="utf-8"))["records"]
                  old_covered = {
                      row["taxonomy"]["gbifTaxonKey"]
                      for row in old_rows if row.get("media")
                  }
                  new_covered = {
                      row["taxonomy"]["gbifTaxonKey"]
                      for row in new_rows if row.get("media")
                  }
                  lost = old_covered - new_covered
                  if lost:
                      raise SystemExit(
                          f"Previously illustrated Cattleya taxa lost all images: {sorted(lost)}. "
                          "Review source changes before publishing."
                      )
                  print(f"Cattleya image coverage: {len(old_covered)} -> {len(new_covered)} species.")
              print(f"{path}: baseline {old_count}, refreshed {new_count}; OK.")
          PY

      - name: Commit refreshed data
        run: |
          git add data/cattleya_open_catalog.json data/cattleya_open_media.json
          if git diff --cached --quiet -- data/cattleya_open_catalog.json data/cattleya_open_media.json; then
            echo 'No catalogue changes.'
            exit 0
          fi
          git config user.name 'orchidarium-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Refresh Cattleya open-data catalogue'
          if git push; then
            echo 'Cattleya catalogue published successfully.'
            exit 0
          fi
          # Another workflow may have published a newer catalogue while this
          # long-running job was fetching images. Never force-push stale data.
          echo 'Push rejected: checking whether a newer catalogue is already published.'
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          if python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path

          branch = __import__("os").environ.get("GITHUB_REF_NAME", "main")
          paths = ("data/cattleya_open_catalog.json", "data/cattleya_open_media.json")
          for path in paths:
              published = subprocess.check_output(
                  ["git", "show", f"origin/{branch}:{path}"], text=True,
              )
              remote_time = datetime.fromisoformat(json.loads(published)["metadata"]["generatedAt"])
              local_time = datetime.fromisoformat(
                  json.loads(Path(path).read_text(encoding="utf-8"))["metadata"]["generatedAt"]
              )
              if remote_time < local_time:
                  print(f"{path}: remote data is older; refusing to discard this update.")
                  raise SystemExit(1)
              print(f"{path}: newer or equal data already published ({remote_time.isoformat()}).")
          PY
          then
            echo 'A newer catalogue is already on the remote; stale run safely skipped.'
            exit 0
          fi
          echo 'Remote changed without newer catalogue data; rerun from latest main is required.'
          exit 1
